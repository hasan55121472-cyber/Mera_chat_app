name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Fix All Screens - Final
        run: |
          mkdir -p lib
          flutter create . --platforms=android --project-name whatsapp_clone
          cp -f google-services.json android/app/ 2>/dev/null || true

          # 1. Chat Screen ko 100% working banao - sab errors khatam
          cat > lib/chat_screen.dart << 'EOF'
          import 'package:flutter/material.dart';
          class ChatScreen extends StatelessWidget {
            const ChatScreen({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF075E54),
                  title: const Row(
                    children: [
                      CircleAvatar(child: Icon(Icons.person)),
                      SizedBox(width: 10),
                      Text("Ali Khan"),
                    ],
                  ),
                ),
                body: Column(
                  children: [
                    Expanded(
                      child: ListView(
                        padding: const EdgeInsets.all(12),
                        children: [
                          Align(alignment: Alignment.centerLeft, child: Container(padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(8)), child: const Text("Hello!"))),
                          const SizedBox(height: 10),
                          Align(alignment: Alignment.centerRight, child: Container(padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: const Color(0xFFDCF8C6), borderRadius: BorderRadius.circular(8)), child: const Text("Hi, how are you?"))),
                        ],
                      ),
                    ),
                    Container(
                      padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                      color: Colors.white,
                      child: Row(
                        children: [
                          const Expanded(child: TextField(decoration: InputDecoration(hintText: "Type a message", border: InputBorder.none))),
                          IconButton(icon: const Icon(Icons.send, color: Color(0xFF075E54)), onPressed: () {}),
                        ],
                      ),
                    ),
                  ],
                ),
                backgroundColor: const Color(0xFFE5DDD5),
              );
            }
          }
          EOF

          # 2. Calls, Status, Settings bhi fix
          cat > lib/calls_screen.dart << 'EOF'
          import 'package:flutter/material.dart';
          class CallsScreen extends StatelessWidget { const CallsScreen({super.key}); @override Widget build(BuildContext context) { return Scaffold(appBar: AppBar(title: const Text('Calls')), body: ListView(children: const [ListTile(leading: CircleAvatar(child: Icon(Icons.person)), title: Text("Ali Khan"), subtitle: Text("Today, 2:30 PM"), trailing: Icon(Icons.call))]), floatingActionButton: FloatingActionButton(backgroundColor: Color(0xFF25D366), onPressed: () {}, child: Icon(Icons.add_call))); } }
          EOF
          cat > lib/status_screen.dart << 'EOF'
          import 'package:flutter/material.dart';
          class StatusScreen extends StatelessWidget { const StatusScreen({super.key}); @override Widget build(BuildContext context) { return Scaffold(appBar: AppBar(title: const Text('Status')), body: ListView(children: [ListTile(leading: Stack(children: [CircleAvatar(radius: 28, child: Icon(Icons.person)), Positioned(bottom: 0, right: 0, child: Icon(Icons.add_circle, color: Color(0xFF25D366)))]), title: Text("My Status"), subtitle: Text("Tap to add"))]), floatingActionButton: FloatingActionButton(backgroundColor: Color(0xFF25D366), onPressed: () {}, child: Icon(Icons.camera_alt))); } }
          EOF
          cat > lib/settings_screen.dart << 'EOF'
          import 'package:flutter/material.dart';
          class SettingsScreen extends StatelessWidget { const SettingsScreen({super.key}); @override Widget build(BuildContext context) { return Scaffold(appBar: AppBar(title: const Text('Settings')), body: const Center(child: Text('Settings'))); } }
          EOF

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
