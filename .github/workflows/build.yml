name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Unzip and Build APK
        run: |
          ls -la
          unzip -o whatsapp_clone.zip -d. || true
          echo "---- After unzip ----"
          ls -la
          PROJECT=$(find. -name "pubspec.yaml" | head -n 1 | xargs dirname)
          echo "Project found at: $PROJECT"
          cd "$PROJECT"
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mera-Chat-APK
          path: "**/app-debug.apk"
