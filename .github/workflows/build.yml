name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          unzip -o whatsapp_clone.zip -d. || true
          PROJECT=$(find. -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          echo "Project at $PROJECT"
          cd "$PROJECT"
          npm install
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mera-Chat-APK
          path: "**/app-debug.apk"
