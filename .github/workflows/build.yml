name: Build APK
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          echo "--- Unzipping project ---"
          unzip -o whatsapp_clone.zip
          echo "--- After unzip ---"
          ls -la
          PUB_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project found at: $PUB_DIR"
          cd $PUB_DIR
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
