name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Project
        run: |
          mkdir -p lib
          mv -f *.dart lib/ 2>/dev/null || true
          mkdir -p android/app
          mv -f google-services.json android/app/ 2>/dev/null || true

      - name: Fix Code Errors
        run: |
          sed -i 's/const LoginScreen()/LoginScreen()/g' lib/main.dart
          sed -i 's/const HomeScreen()/HomeScreen()/g' lib/main.dart
          sed -i 's/const ProfileSetupScreen()/ProfileSetupScreen()/g' lib/main.dart
          sed -i 's/return const LoginScreen/return LoginScreen/g' lib/main.dart
          sed -i 's/return const HomeScreen/return HomeScreen/g' lib/main.dart
          sed -i 's/return const ProfileSetupScreen/return ProfileSetupScreen/g' lib/main.dart

      - run: flutter create . --platforms=android
      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
