name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix scattered files
        run: |
          mkdir -p lib
          mv *.dart lib/ || true
          rm -f AndroidManifest.xml MainActivity.kt build.gradle settings.gradle
          rm -f *.xml google-services.json || true
          ls -la
          ls -la lib/

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Folder
        run: |
          flutter create. --platforms=android --org com.example.whatsappclone

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
